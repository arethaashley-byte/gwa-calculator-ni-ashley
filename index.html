<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWA Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #FC8EAC;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
}

.container {
    width: 90%;
    max-width: 800px;
}

h1 {
    margin-bottom: 20px;
}

.result-box {
    background-color: #E75480;
    padding: 40px;
    border-radius: 15px;
    text-align: right;
    margin-bottom: 25px;
}

.result-box h2 {
    font-size: 60px;
}

.result-box p {
    color: #bfc4d6;
    margin-top: 5px;
}

.card {
    background-color: #E75480;
    padding: 25px;
    border-radius: 15px;
}

.row {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.grade,
.unit {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #FC8EAC;
    color: white;
    font-size: 16px;
}

.delete-btn {
    width: 50px;
    border: none;
    background-color: red;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.add-btn {
    width: 100%;
    padding: 12px;
    background-color: #d4a62b;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    color: black;
}

.add-btn:hover {
    background-color: #e0b53a;
}

@media(max-width: 600px) {
    .row {
        flex-direction: column;
    }

    .delete-btn {
        width: 100%;
        height: 45px;
    }
}
</style>

</head>
<body>

<div class="container">

    <h1>GWA Calculator ni Ashley</h1>

    <div class="result-box">
        <h2 id="gwa">0.0000</h2>
        <p>General Weighted Average</p>
    </div>

    <div class="card">

        <div id="subjects">

            <div class="row">

                <select class="grade" onchange="calculateGWA()">
                    <option value="">Select Grade</option>
                    <option value="1.00">1.00</option>
                    <option value="1.25">1.25</option>
                    <option value="1.50">1.50</option>
                    <option value="1.75">1.75</option>
                    <option value="2.00">2.00</option>
                    <option value="2.25">2.25</option>
                    <option value="2.50">2.50</option>
                    <option value="2.75">2.75</option>
                    <option value="3.00">3.00</option>
                    <option value="5.00">5.00</option>
                </select>

                <select class="unit" onchange="calculateGWA()">
                    <option value="">Units</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <button class="delete-btn" onclick="removeRow(this)">
                    🗑
                </button>

            </div>

        </div>

        <button class="add-btn" onclick="addSubject()">
            Add Subject
        </button>

    </div>

</div>

<script>

function addSubject() {

    let row = document.createElement("div");

    row.className = "row";

    row.innerHTML = `
        <select class="grade" onchange="calculateGWA()">
            <option value="">Select Grade</option>
            <option value="1.00">1.00</option>
            <option value="1.25">1.25</option>
            <option value="1.50">1.50</option>
            <option value="1.75">1.75</option>
            <option value="2.00">2.00</option>
            <option value="2.25">2.25</option>
            <option value="2.50">2.50</option>
            <option value="2.75">2.75</option>
            <option value="3.00">3.00</option>
            <option value="5.00">5.00</option>
        </select>

        <select class="unit" onchange="calculateGWA()">
            <option value="">Units</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <button class="delete-btn" onclick="removeRow(this)">
            🗑
        </button>
    `;

    document.getElementById("subjects").appendChild(row);
}

function removeRow(button) {

    let rows = document.querySelectorAll(".row");

    if (rows.length > 1) {
        button.parentElement.remove();
        calculateGWA();
    }
}

function calculateGWA() {

    let grades = document.querySelectorAll(".grade");
    let units = document.querySelectorAll(".unit");

    let totalWeighted = 0;
    let totalUnits = 0;

    for (let i = 0; i < grades.length; i++) {

        let grade = parseFloat(grades[i].value);
        let unit = parseFloat(units[i].value);

        if (!isNaN(grade) && !isNaN(unit)) {
            totalWeighted += grade * unit;
            totalUnits += unit;
        }
    }

    let gwa = totalUnits > 0 ? totalWeighted / totalUnits : 0;

    document.getElementById("gwa").innerText = gwa.toFixed(4);
}

</script>

</body>
</html>
